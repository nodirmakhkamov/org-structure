<style>
/* ── RESET ──────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:    #E8392A;
  --brand-lt: #FFF0EE;
  --bg:       #F4F4F4;
  --card:     #FFFFFF;
  --t1:       #1A1A1A;
  --t2:       #6B6B6B;
  --t3:       #9B9B9B;
  --border:   #E5E5E5;
  --border-h: #CCCCCC;
  --shadow:   0 2px 8px rgba(0,0,0,.06);
  --shadow-h: 0 4px 16px rgba(0,0,0,.10);
  --r:        16px;
  --font:     'Inter', -apple-system, sans-serif;
  --ease:     cubic-bezier(.4,0,.2,1);
  --ch:       160px;
  --pw:       38%;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--t1);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
a{color:inherit;text-decoration:none}

/* ── HEADER ─────────────────────────────────────────────── */
.hdr{
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:16px 24px;
}
.hdr-inner{
  max-width:1200px;margin:0 auto;
  display:flex;align-items:center;gap:12px;
}
.logo-brand{
  font-size:22px;font-weight:700;
  color:var(--brand);letter-spacing:-.03em;line-height:1;
}
.logo-sep{color:var(--border);margin:0 2px;font-weight:300}
.logo-sub{font-size:13px;font-weight:400;color:var(--t3);white-space:nowrap}

/* ── SEARCH + TABS BAR ──────────────────────────────────── */
.srch-bar{
  position:sticky;top:0;z-index:200;
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:10px 24px 0;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.srch-inner{
  max-width:1200px;margin:0 auto;
  position:relative;display:flex;align-items:center;
}
.srch-ico{
  position:absolute;left:14px;color:var(--t3);
  display:flex;pointer-events:none;
}
.srch-input{
  width:100%;
  padding:10px 90px 10px 40px;
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:12px;
  font-family:var(--font);font-size:14px;
  color:var(--t1);outline:none;
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease);
}
.srch-input::placeholder{color:var(--t3)}
.srch-input:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(232,57,42,.08);
}
.srch-badge{
  position:absolute;right:14px;
  font-size:12px;color:var(--t3);pointer-events:none;
}

/* ── TABS ───────────────────────────────────────────────── */
.tabs-inner{
  max-width:1200px;margin:8px auto 0;
  display:flex;gap:4px;
}
.tab{
  padding:7px 16px;
  border-radius:8px 8px 0 0;
  border:none;cursor:pointer;
  font-family:var(--font);font-size:13px;font-weight:500;
  background:transparent;color:var(--t3);
  transition:background .15s,color .15s;
  outline:none;white-space:nowrap;
}
.tab.tab-active{background:var(--brand);color:#fff}
.tab:not(.tab-active):hover{color:var(--t1);background:var(--bg)}

/* ── LAYOUT ─────────────────────────────────────────────── */
.main{max-width:1200px;margin:0 auto;padding:28px 24px 80px}

/* ── SECTION ────────────────────────────────────────────── */
.sec{margin-bottom:36px}
.sec:last-child{margin-bottom:0}
.sec-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sec-icon{
  width:26px;height:26px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:13px;
}
.sec-label{
  font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--t2);white-space:nowrap;
}
.sec-count{
  font-size:11px;color:var(--t3);
  background:var(--bg);border:1px solid var(--border);
  border-radius:100px;padding:1px 7px;
}
.sec-line{flex:1;height:1px;background:var(--border)}

/* ── GRIDS ──────────────────────────────────────────────── */
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:start}
.gs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-items:start}

/* ── CARD ───────────────────────────────────────────────── */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  overflow:hidden;
  display:flex;flex-direction:row;
  min-height:var(--ch);
  position:relative;
  box-shadow:var(--shadow);
  animation:fadeUp .35s var(--ease) both;
  transition:box-shadow .2s var(--ease),border-color .2s var(--ease);
}
.card:hover{box-shadow:var(--shadow-h);border-color:var(--border-h)}
.card::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:3px;
  background:var(--strip,var(--brand));
  z-index:3;pointer-events:none;
}

/* ── PHOTO ZONE ─────────────────────────────────────────── */
.card-photo{
  width:var(--pw);flex-shrink:0;
  position:relative;overflow:hidden;
  background:var(--strip-bg,var(--brand-lt));
}
/* right-to-left fade into card background */
.card-photo::after{
  content:'';position:absolute;
  top:0;right:0;
  width:30%;height:100%;
  background:linear-gradient(to left, var(--card) 0%, transparent 100%);
  z-index:2;pointer-events:none;
}
.card-photo img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:center 20%;
  display:block;
}
.initials{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:700;letter-spacing:-.02em;
  color:var(--strip,var(--brand));
  user-select:none;
}

/* ── TEXT BODY ──────────────────────────────────────────── */
.card-body{
  padding:13px 14px 13px 13px;
  display:flex;flex-direction:column;gap:3px;
  flex:1;overflow:hidden;min-width:0;
}
.card-badge{
  display:inline-flex;align-items:center;
  font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  background:var(--brand-lt);color:var(--brand);
  border-radius:4px;padding:2px 6px;
  width:fit-content;margin-bottom:2px;flex-shrink:0;
}
.card-name{
  font-size:13.5px;font-weight:600;color:var(--t1);
  line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-role{
  font-size:11.5px;font-weight:400;color:var(--t2);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  line-clamp:3;overflow:hidden;
}
.card-desc{
  font-size:10.5px;color:var(--t3);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  line-clamp:2;overflow:hidden;margin-top:4px;
}

/* ── EMPTY ──────────────────────────────────────────────── */
.empty{
  grid-column:1/-1;text-align:center;
  padding:64px 24px;color:var(--t3);font-size:14px;
}

/* ── ABOUT / COMPANY CARDS ──────────────────────────────── */
.about-wrap{display:none}
.about-wrap.active{display:block}

.about-intro{
  background:#fff;
  border-left:4px solid var(--brand);
  border-radius:var(--r);
  padding:24px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}
.about-intro-title{
  font-size:20px;font-weight:700;color:var(--t1);
  margin-bottom:6px;line-height:1.25;
}
.about-intro-sub{
  font-size:14px;color:var(--t3);line-height:1.55;
}

.companies-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}
.co-card{
  background:#fff;border:1px solid var(--border);
  border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;position:relative;padding:22px 20px 24px;
}
.co-card::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:3px;
  background:var(--co-color, var(--brand));
}
.co-logo{
  width:44px;height:44px;border-radius:50%;
  background:var(--co-bg, var(--brand-lt));
  color:var(--co-color, var(--brand));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;letter-spacing:-.01em;
  margin-bottom:14px;flex-shrink:0;
}
.co-name{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:3px;line-height:1.3}
.co-type{font-size:12px;font-style:italic;color:var(--t3);margin-bottom:0}
.co-divider{height:1px;background:var(--border);margin:10px 0}
.co-desc{font-size:13px;color:var(--t2);line-height:1.55}

/* ── FOOTER ─────────────────────────────────────────────── */
.ftr{
  text-align:center;padding:20px 24px;
  border-top:1px solid var(--border);
  font-size:11px;color:var(--t3);
  background:var(--card);
}

/* ── ANIMATIONS ─────────────────────────────────────────── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

/* ── RESPONSIVE ─────────────────────────────────────────── */

/* Desktop ≥ 769px */
@media(min-width:769px){
  :root{--ch:155px}
  .gs .card:first-child{grid-column:1/-1}
}

/* Tablet 480–768px */
@media(min-width:480px) and (max-width:768px){
  :root{--ch:130px}
  .card-name{font-size:13px}
  .card-desc{font-size:10px}
}

/* Mobile < 480px */
@media(max-width:479px){
  :root{--ch:115px;--pw:33%}
  .g2,.gs,.companies-grid{grid-template-columns:1fr}
  .main{padding:16px 12px 60px}
  .hdr{padding:12px 12px}
  .logo-sub{display:none}
  .srch-bar{padding:8px 12px 0}
  .srch-input{min-height:48px;font-size:15px;padding:0 12px 0 40px}
  .tabs-inner{gap:0}
  .tab{
    flex:1;height:44px;
    border-radius:8px 8px 0 0;
    font-size:12px;padding:0 6px;
    display:flex;align-items:center;justify-content:center;
  }
  .sec{margin-bottom:20px}
  .sec-hdr{margin-bottom:8px}
  .sec-label{font-size:11px}
  .sec-icon{width:22px;height:22px;font-size:11px}
  .card-name{font-size:12px;font-weight:600}
  .card-role{font-size:10px;-webkit-line-clamp:2;line-clamp:2}

  .card-body{padding:8px 8px 8px 7px;gap:1px}
  .initials{font-size:18px}
}
</style>

/* ── PHOTO POSITION (ratio-based, with posOverride support) ─ */
function applyPhotoPos(img) {
  if (img.dataset.posOverride) {
    img.style.objectPosition = img.dataset.posOverride;
    if (img.dataset.contain) img.style.objectFit = 'contain';
    return;
  }
  const r = img.naturalWidth / img.naturalHeight;
  if (r < 0.8)      img.style.objectPosition = 'center 15%';
  else if (r > 1.2) img.style.objectPosition = 'center 30%';
  else               img.style.objectPosition = 'center 20%';
}

/* handles images already loaded from cache */
function initPhotoPositions() {
  document.querySelectorAll('.card-photo img').forEach(img => {
    if (img.complete && img.naturalWidth) applyPhotoPos(img);
  });
}

/* ── RENDER CARD ────────────────────────────────────────── */
let cardIdx = 0;

function card(emp) {
  const lv    = LV[emp.level] || LV.admin;
  const delay = (cardIdx++ * 40) + 'ms';

  const posAttr     = emp.posOverride  ? ` data-pos-override="${emp.posOverride}"` : '';
  const containAttr = emp.photoContain ? ' data-contain="1"' : '';
  const photoBlock = emp.photoFile
    ? `<img src="photos/${encodeURIComponent(emp.photoFile)}" alt="${emp.name}"
           onload="applyPhotoPos(this)"${posAttr}${containAttr}
           onerror="this.style.display='none';this.parentElement.querySelector('.initials').style.display='flex'">
       <div class="initials" style="display:none">${emp.ini}</div>`
    : `<div class="initials">${emp.ini}</div>`;

  const photoBgStyle = emp.photoBg ? ` style="background:${emp.photoBg}"` : '';
  const desc = emp.desc ? `<p class="card-desc">${emp.desc}</p>` : '';

  return `<article class="card"
  style="--strip:${lv.c};--strip-bg:${lv.bg};animation-delay:${delay}"
  data-q="${(emp.name + ' ' + emp.role).toLowerCase()}">
  <div class="card-photo"${photoBgStyle}>${photoBlock}</div>
  <div class="card-body">
    <span class="card-badge">${lv.label}</span>
    <div class="card-name">${emp.name}</div>
    <div class="card-role">${emp.role}</div>
    ${desc}
  </div>
</article>`;
}

/* ── RENDER SECTION ─────────────────────────────────────── */
function sec(label, icon, lv, emps, gridCls) {
  if (!emps.length) return '';
  return `<section class="sec">
  <div class="sec-hdr">
    <div class="sec-icon" style="background:${lv.bg};color:${lv.c}">${icon}</div>
    <span class="sec-label">${label}</span>
    <span class="sec-count">${emps.length}</span>
    <div class="sec-line"></div>
  </div>
  <div class="${gridCls}">${emps.map(e => card(e)).join('')}</div>
</section>`;
}

/* ── TAB SWITCH ─────────────────────────────────────────── */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('tab-active', t.dataset.tab === tab));
  const isOrg = tab === 'org';
  document.getElementById('app').style.display      = isOrg ? '' : 'none';
  document.getElementById('about').classList.toggle('active', !isOrg);
  document.getElementById('srch-row').style.display = isOrg ? '' : 'none';
}

    sec('Стратегическое управление',          SI.strategic, LV.strategic, g('strategic'), 'gs'),

}
