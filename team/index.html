<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Команда · Rahmat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>R</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
body{background:var(--mist);color:var(--ink)}
.team{max-width:1120px;margin:0 auto;padding:24px 24px 72px;width:100%}
.page-h{margin:6px 0 2px}
.page-h em{font-style:normal;color:var(--red)}

/* ── FAQ плитки ─────────────────────────────────────────── */
.faq{margin:22px 0 26px}
.faq-cap{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.faq-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.faq-tile{
  display:flex;flex-direction:column;gap:6px;min-height:44px;
  text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--paper);
  padding:14px 15px;cursor:pointer;font-family:var(--body);
  transition:border-color .15s ease,transform .15s ease;
}
.faq-tile:hover{border-color:var(--red);transform:translateY(-1px)}
.faq-tile .q{font-weight:700;font-size:14.5px;color:var(--ink)}
.faq-tile .a{font-size:12px;color:var(--muted);line-height:1.35}
.faq-tile .ico{font-size:18px;line-height:1}

/* ── Переключатель режимов ──────────────────────────────── */
.modes{display:inline-flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:22px}
.mode-btn{
  appearance:none;border:none;background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  height:40px;padding:0 20px;border-radius:999px;transition:background .15s,color .15s;
}
.mode-btn[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ── Общая карточка человека (компактная, для схемы) ────── */
.pc{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:9px 11px;text-align:left}
.pc-av{width:38px;height:38px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:12px;background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c)}
.pc-av img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.pc-meta{min-width:0}
.pc-name{font-size:13px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-role{font-size:11px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-leader{border:1.5px solid var(--red)}
.pc-head{border:1.5px solid var(--c)}

/* ── Режим «Схема» (десктоп) ────────────────────────────── */
.schema{padding-top:6px}
.schema-leader-wrap{display:flex;justify-content:center}
.schema-leader-wrap .pc{max-width:340px;width:100%}
.schema-stem{width:2px;height:26px;background:var(--line);margin:0 auto}
.schema-blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;align-items:start}
.sb{border-top:2px solid var(--line);padding-top:14px;position:relative}
.sb-cap{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:none;cursor:default;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:12px;text-align:left}
.sb-cap .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex-shrink:0}
.sb-count{margin-left:auto;font-size:11px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:0 7px;line-height:18px}
.sb-chev{display:none}
.sb-body{display:flex;flex-direction:column;gap:8px}
.sb-connect{width:2px;height:10px;background:var(--line);margin:0 auto}
.sb-list{display:flex;flex-direction:column;gap:8px}

/* ── Режим «Люди» ───────────────────────────────────────── */
.tools{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.srch{position:relative}
.srch input{
  width:100%;min-height:46px;padding:0 44px 0 42px;
  background:var(--paper);border:1px solid var(--line);border-radius:14px;
  font-family:var(--body);font-size:15px;color:var(--ink);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.srch input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(244,53,48,.1)}
.srch .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  appearance:none;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  height:36px;padding:0 13px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:#fff}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--ink)) 22%,transparent)}

.focus-banner{display:none;align-items:center;gap:12px;background:color-mix(in srgb,var(--red) 8%,#fff);border:1px solid color-mix(in srgb,var(--red) 30%,#fff);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.focus-banner.on{display:flex}
.focus-banner button{margin-left:auto;appearance:none;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:999px;height:34px;padding:0 14px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}

.sec{margin-bottom:28px}
.sec-hdr{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sec-hdr .dot{width:11px;height:11px;border-radius:50%;background:var(--c)}
.sec-hdr .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec-hdr .cnt{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px;line-height:18px}
.sec-hdr .line{flex:1;height:1px;background:var(--line)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;min-height:132px}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);z-index:2}
.card-photo{width:34%;flex-shrink:0;position:relative;overflow:hidden;background:color-mix(in srgb,var(--c) 13%,#fff)}
.card-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.card-ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:24px;color:var(--c)}
.card-body{flex:1;min-width:0;padding:13px 15px;display:flex;flex-direction:column;gap:3px}
.card-badge{align-self:flex-start;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:5px;padding:2px 7px;margin-bottom:3px}
.card-name{font-size:14.5px;font-weight:700;line-height:1.25}
.card-role{font-size:12px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-desc{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-contacts{margin-top:auto;display:flex;flex-wrap:wrap;gap:10px;padding-top:8px}
.card-contacts a,.card-contacts span{font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none}
.card-contacts a:hover{color:var(--red)}

.empty{text-align:center;padding:56px 20px;color:var(--muted);font-size:15px}

.is-hidden{display:none!important}

/* ── Мобайл: дерево вместо горизонтальной схемы ─────────── */
@media (max-width:768px){
  .faq-grid{grid-template-columns:1fr 1fr}
  .schema-blocks{display:block}
  .sb{border-top:1px solid var(--line);padding-top:0;margin-top:10px}
  .sb:first-child{margin-top:0}
  .sb-cap{cursor:pointer;min-height:48px;margin-bottom:0;color:var(--ink);font-size:12px}
  .sb-chev{display:block;margin-left:8px;transition:transform .2s ease;color:var(--muted)}
  .sb.collapsed .sb-chev{transform:rotate(-90deg)}
  .sb-count{margin-left:auto}
  .sb .sb-body{padding:2px 0 14px}
  .sb.collapsed .sb-body{display:none}
  .cards{grid-template-columns:1fr}
  .card{min-height:120px}
}
@media (max-width:400px){
  .faq-grid{grid-template-columns:1fr}
  .team{padding:16px 12px 60px}
}
</style>
</head>
<body class="has-head">

<header class="site-head">
  <div class="site-head__in">
    <a class="site-head__brand" href="/">rahmat</a>
    <nav class="site-head__nav">
      <a href="/">О компании</a>
      <a href="/team" aria-current="page">Команда</a>
    </nav>
  </div>
</header>

<main class="team">
  <div class="eyebrow">Кто есть кто</div>
  <h1 class="h-display page-h" style="font-size:clamp(28px,5vw,44px)">Наша <em>команда</em></h1>

  <!-- Частые вопросы новичка -->
  <section class="faq">
    <div class="faq-cap">Частые вопросы новичка</div>
    <div class="faq-grid" id="faq"></div>
  </section>

  <!-- Переключатель режимов -->
  <div class="modes" role="group" aria-label="Режим отображения">
    <button class="mode-btn" data-mode="schema" aria-pressed="true" onclick="setMode('schema')">Схема</button>
    <button class="mode-btn" data-mode="people" aria-pressed="false" onclick="setMode('people')">Люди</button>
  </div>

  <!-- Режим «Схема» -->
  <div id="view-schema" class="schema"></div>

  <!-- Режим «Люди» -->
  <div id="view-people" class="is-hidden">
    <div class="tools">
      <div class="srch">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
        <input id="srch" type="search" autocomplete="off" spellcheck="false"
          placeholder="Поиск по имени, должности, зоне ответственности…">
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="focus-banner" id="focus-banner">
      <span id="focus-text"></span>
      <button onclick="clearFocus()">Показать всех</button>
    </div>
    <div id="people-list"></div>
  </div>
</main>

<script src="../assets/people.js"></script>
<script>
const BLOCK_ORDER = ['manage','it','finance','control','commerce','products','adm'];
const byId = id => PEOPLE.find(p => p.id === id);

/* ── Плитки частых вопросов (адрес — по id, не по фамилии) ─ */
const FAQ = [
  { ico:'🪪', q:'Нужен пропуск',                a:'Управляющий делами, АХО',    to:'botir-tursunov'  },
  { ico:'✉️', q:'Не работает почта или доступ', a:'Системный администратор, IT', to:'pavel-tigay'     },
  { ico:'📄', q:'Вопрос по договору',           a:'Юридический отдел',           to:'rustam-zakirov'  },
  { ico:'👥', q:'Кадровый вопрос',              a:'Кадровое администрирование',  to:'dinara-tugusheva'},
];

/* ── Фото: кадрирование как в исходном справочнике ──────── */
function photoNode(p){
  if(!p.photoFile) return '<div class="card-ini">'+p.ini+'</div>';
  const pos = p.posOverride || 'center 20%';
  const fit = p.photoContain ? 'contain' : 'cover';
  const bg  = p.photoBg ? ';background:'+p.photoBg : '';
  return '<img src="../photos/'+encodeURIComponent(p.photoFile)+'" alt="'+p.name+'"'
    + ' style="object-position:'+pos+';object-fit:'+fit+bg+'"'
    + ' onerror="this.style.display=\'none\';this.parentElement.querySelector(\'.card-ini\').style.display=\'flex\'">'
    + '<div class="card-ini" style="display:none">'+p.ini+'</div>';
}
function avNode(p){
  if(!p.photoFile) return p.ini;
  const pos = p.posOverride || 'center 20%';
  return '<img src="../photos/'+encodeURIComponent(p.photoFile)+'" alt="'+p.name+'"'
    + ' style="object-position:'+pos+'"'
    + ' onerror="this.replaceWith(document.createTextNode(\''+p.ini+'\'))">';
}

/* ── СХЕМА ──────────────────────────────────────────────── */
function schemaCard(p, cls){
  return '<div class="pc '+(cls||'')+'" style="--c:'+BLOCKS[p.block].color+'">'
    + '<div class="pc-av">'+avNode(p)+'</div>'
    + '<div class="pc-meta"><div class="pc-name">'+p.name+'</div><div class="pc-role">'+p.role+'</div></div>'
    + '</div>';
}
function renderSchema(){
  const leader = PEOPLE.find(p => p.companyLead);
  let html = '<div class="schema-leader-wrap">'+schemaCard(leader,'pc-leader')+'</div>'
           + '<div class="schema-stem"></div><div class="schema-blocks">';

  BLOCK_ORDER.forEach(key => {
    let members = PEOPLE.filter(p => p.block === key && !p.companyLead);
    const head = members.find(p => p.leads === key) || null;
    const rest = members.filter(p => p !== head);
    if(!members.length) return;
    html += '<section class="sb collapsed" data-block="'+key+'" style="--c:'+BLOCKS[key].color+'">'
      + '<button class="sb-cap" type="button"><span class="dot"></span>'+BLOCKS[key].label
      + '<span class="sb-count">'+members.length+'</span>'
      + '<svg class="sb-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>'
      + '</button><div class="sb-body">';
    if(head){
      html += schemaCard(head,'pc-head') + '<div class="sb-connect"></div>';
    }
    html += '<div class="sb-list">' + rest.map(p => schemaCard(p)).join('') + '</div>';
    html += '</div></section>';
  });
  html += '</div>';
  document.getElementById('view-schema').innerHTML = html;
  wireAccordion();
}

/* Аккордеон только на мобильном; на десктопе всё раскрыто. */
let mq = window.matchMedia('(max-width:768px)');
function wireAccordion(){
  const blocks = [...document.querySelectorAll('.sb')];
  blocks.forEach(sb => {
    const cap = sb.querySelector('.sb-cap');
    cap.onclick = () => { if(mq.matches) sb.classList.toggle('collapsed'); };
    sb.classList.toggle('collapsed', mq.matches); // моб: свёрнуто, десктоп: раскрыто
  });
}
mq.addEventListener('change', () => {
  document.querySelectorAll('.sb').forEach(sb => sb.classList.toggle('collapsed', mq.matches));
});

/* ── ЛЮДИ ───────────────────────────────────────────────── */
let state = { block:'all', query:'', focus:null };

function renderChips(){
  let html = '<button class="chip" data-block="all" aria-pressed="true" onclick="setBlock(\'all\')">Все</button>';
  BLOCK_ORDER.forEach(key => {
    html += '<button class="chip" data-block="'+key+'" aria-pressed="false" style="--c:'+BLOCKS[key].color+'" onclick="setBlock(\''+key+'\')">'
      + '<span class="dot"></span>'+BLOCKS[key].label+'</button>';
  });
  document.getElementById('chips').innerHTML = html;
}
function peopleCard(p){
  const contacts = [];
  if(p.tg)    contacts.push('<a href="https://t.me/'+p.tg.replace(/^@/,'')+'" target="_blank" rel="noopener">'+p.tg+'</a>');
  if(p.phone) contacts.push('<a href="tel:'+p.phone.replace(/[^+\d]/g,'')+'">'+p.phone+'</a>');
  const cc = contacts.length ? '<div class="card-contacts">'+contacts.join('')+'</div>' : '';
  const desc = p.desc ? '<div class="card-desc">'+p.desc+'</div>' : '';
  return '<article class="card" style="--c:'+BLOCKS[p.block].color+'">'
    + '<div class="card-photo">'+photoNode(p)+'</div>'
    + '<div class="card-body">'
    +   '<span class="card-badge">'+BLOCKS[p.block].label+'</span>'
    +   '<div class="card-name">'+p.name+'</div>'
    +   '<div class="card-role">'+p.role+'</div>'
    +   desc + cc
    + '</div></article>';
}
function matches(p){
  const q = state.query;
  if(!q) return true;
  return (p.name+' '+p.nameLat+' '+p.role+' '+p.desc).toLowerCase().includes(q);
}
function renderPeople(){
  const box = document.getElementById('people-list');
  const banner = document.getElementById('focus-banner');

  if(state.focus){
    const p = byId(state.focus);
    banner.classList.add('on');
    document.getElementById('focus-text').innerHTML = 'Показан ответственный: <b>'+p.name+'</b>';
    box.innerHTML = '<div class="cards">'+peopleCard(p)+'</div>';
    return;
  }
  banner.classList.remove('on');

  let html = '';
  BLOCK_ORDER.forEach(key => {
    if(state.block !== 'all' && state.block !== key) return;
    const list = PEOPLE.filter(p => p.block === key && matches(p));
    if(!list.length) return;
    html += '<section class="sec">'
      + '<div class="sec-hdr" style="--c:'+BLOCKS[key].color+'"><span class="dot"></span>'
      + '<span class="lbl">'+BLOCKS[key].label+'</span><span class="cnt">'+list.length+'</span><span class="line"></span></div>'
      + '<div class="cards">'+list.map(peopleCard).join('')+'</div></section>';
  });
  box.innerHTML = html || '<div class="empty">Никого не нашлось по запросу «'+state.query+'»</div>';
}

/* ── управление состоянием ──────────────────────────────── */
function setMode(m){
  document.querySelectorAll('.mode-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode===m));
  document.getElementById('view-schema').classList.toggle('is-hidden', m!=='schema');
  document.getElementById('view-people').classList.toggle('is-hidden', m!=='people');
}
function setBlock(key){
  state.block = key; state.focus = null;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.block===key));
  renderPeople();
}
function clearFocus(){
  state.focus = null; state.query = '';
  document.getElementById('srch').value = '';
  setBlock('all');
}
function focusPerson(id){
  state.focus = id; state.query=''; state.block='all';
  document.getElementById('srch').value='';
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.block==='all'));
  setMode('people');
  renderPeople();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── FAQ ────────────────────────────────────────────────── */
function renderFAQ(){
  document.getElementById('faq').innerHTML = FAQ.map(f =>
    '<button class="faq-tile" type="button" onclick="focusPerson(\''+f.to+'\')">'
    + '<span class="ico">'+f.ico+'</span><span class="q">'+f.q+'</span><span class="a">'+f.a+'</span></button>'
  ).join('');
}

/* ── init ───────────────────────────────────────────────── */
document.getElementById('srch').addEventListener('input', function(){
  state.query = this.value.trim().toLowerCase();
  state.focus = null;
  renderPeople();
});
renderFAQ();
renderChips();
renderSchema();
renderPeople();
</script>
</body>
</html>
