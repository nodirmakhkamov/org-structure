<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Управление структурой · Rahmat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>R</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<!-- Tabler-иконки (webfont). Если не загрузятся — .no-ticons скроет глифы, текст останется. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
/* Маппинг переменных исходного фрагмента на общие токены сайта. */
:root{
  --font-sans:var(--body);
  --color-text-primary:var(--ink);
  --color-text-secondary:var(--muted);
  --color-text-tertiary:#9B9B9B;
  --color-background-primary:var(--paper);
  --color-border-secondary:#CCCCCC;
  --color-border-tertiary:var(--line);
  --border-radius-lg:14px;
}
body{background:var(--mist);color:var(--ink)}
.oc-main{max-width:1120px;margin:0 auto;padding:24px 24px 72px;width:100%}
.oc-title{margin:8px 0 4px}
.oc-eyebrow{margin-bottom:2px}

.oc-wrap{padding:1.5rem 0 2rem;font-family:var(--font-sans)}
.oc-section-label{text-align:center;font-size:11px;color:var(--color-text-tertiary);letter-spacing:.1em;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:10px;font-family:var(--mono)}
.oc-section-label::before,.oc-section-label::after{content:'';flex:1;height:1px;background:var(--color-border-tertiary)}
.oc-connector{width:2px;height:24px;background:var(--color-border-secondary);margin:0 auto}
.oc-card{background:var(--color-background-primary);border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:12px 14px;cursor:pointer;transition:border-color .15s;position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:6px}
.oc-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.oc-card:hover{border-color:var(--color-border-secondary)}
.oc-card.lv-director::before{background:var(--blk-manage)}
.oc-card.lv-csuite::before{background:var(--blk-it)}
.oc-card.lv-admin::before{background:var(--blk-finance)}
.oc-card.lv-head::before{background:var(--blk-control)}
.oc-card.lv-deputy::before{background:var(--blk-adm)}
.oc-card.lv-consult::before{background:var(--blk-commerce)}
/* руководитель компании выделен красной рамкой */
.oc-card.lv-director{border-color:var(--blk-manage);border-width:1.5px}
.oc-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;font-family:var(--mono);overflow:hidden}
.oc-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center top}
.av-director{background:#FEE9E8;color:#B0201B}
.av-csuite{background:#E7EEFF;color:#1B3D9B}
.av-admin{background:#E3F5EE;color:#0B5B44}
.av-head{background:#EDEBFE;color:#3A2E8F}
.av-deputy{background:#EDEEEF;color:#3A3E45}
.av-consult{background:#FDEEE1;color:#9A4A05}
.oc-top{display:flex;align-items:center;gap:10px}
.oc-name{font-size:13px;font-weight:600;color:var(--color-text-primary);line-height:1.3}
.oc-role{font-size:11px;color:var(--color-text-secondary);line-height:1.4}
.oc-dept{font-size:10px;color:var(--color-text-tertiary);margin-top:2px}
.oc-desc{font-size:11px;color:var(--color-text-tertiary);line-height:1.4;border-top:1px solid var(--color-border-tertiary);padding-top:6px}
.oc-contacts{display:none;border-top:1px solid var(--color-border-tertiary);padding-top:8px;gap:6px;flex-direction:column}
.oc-contacts.open{display:flex}
.oc-contact-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-secondary)}
.oc-contact-row i{font-size:14px;color:var(--color-text-tertiary)}
.oc-hint{font-size:10px;color:var(--color-text-tertiary);margin-top:4px;text-align:right;font-family:var(--mono);letter-spacing:.04em}
.oc-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.oc-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.oc-grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px}
.oc-sub-row{display:flex;gap:8px;margin-top:8px;margin-left:24px;position:relative}
.oc-sub-row::before{content:'';position:absolute;left:-16px;top:-8px;width:1px;height:calc(100% + 8px);background:var(--color-border-secondary)}
.oc-sub-row::after{content:'';position:absolute;left:-16px;top:50%;width:16px;height:1px;background:var(--color-border-secondary);transform:translateY(-50%)}
@media(max-width:520px){.oc-grid-3{grid-template-columns:1fr}.oc-grid-2{grid-template-columns:1fr}}
</style>
</head>
<body class="has-head">

<header class="site-head">
  <div class="site-head__in">
    <a class="site-head__brand" href="/">rahmat</a>
    <nav class="site-head__nav">
      <a href="/">О компании</a>
      <a href="/team">Команда</a>
    </nav>
  </div>
</header>

<main class="oc-main">
  <div class="eyebrow oc-eyebrow">Служебная страница</div>
  <h1 class="h-display oc-title" style="font-size:clamp(26px,4vw,40px)">Управление <em>структурой</em></h1>

  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Организационная структура руководства компании</h2>

  <!-- Карточки рендерятся из assets/people.js — встроенных данных о людях здесь нет. -->
  <div class="oc-wrap" id="oc-wrap"></div>
</main>

<script src="../assets/people.js"></script>
<script>
/* ── Внутренняя схема /manage: только СТРУКТУРА (ids), данные о людях из people.js ─ */
const byId = id => window.PEOPLE.find(p => p.id === id);
const STRUCT = {
  director:    'ilxom-idiyev',
  csuite:      ['shorasul-shoikromov','aleksey-orlovskiy','dmitriy-muminov'],
  accountant:  'mukarram-ismailova',
  consultants: ['alisher-bozorov','marking-yevgeniy','veksler-viktor'],
  admin:       ['botir-tursunov'],
  heads:       ['konstantin-zinoviev','sardor-pazilov','timur-burxanov','elvira-aglyamova',
                'abdusamadxon-maxmudov','timur-manyurov','baxtiyor-nasirov','rustam-zakirov'],
};

function avatar(p, lv, small){
  const size = small ? ' style="width:28px;height:28px;font-size:10px"' : '';
  const inner = p.photoFile
    ? '<img src="../photos/'+encodeURIComponent(p.photoFile)+'" alt="'+p.name+'"'
      + ' onerror="this.replaceWith(document.createTextNode(\''+p.ini+'\'))">'
    : p.ini;
  return '<div class="oc-avatar av-'+lv+'"'+size+'>'+inner+'</div>';
}
function contacts(p){
  const rows = [];
  if(p.tg)    rows.push('<div class="oc-contact-row"><i class="ti ti-brand-telegram" aria-hidden="true"></i>'+p.tg+'</div>');
  if(p.phone) rows.push('<div class="oc-contact-row"><i class="ti ti-phone" aria-hidden="true"></i>'+p.phone+'</div>');
  if(!rows.length) rows.push('<div class="oc-contact-row" style="color:var(--color-text-tertiary);font-style:italic">Контакты не указаны</div>');
  return '<div class="oc-contacts">'+rows.join('')+'</div>';
}
function card(id, lv, opts){
  opts = opts || {};
  const p = byId(id);
  if(!p) return '';                         // удалённого человека молча пропускаем
  const role = p.roleInternal || p.role;    // на /manage приоритет — внутренняя формулировка
  const nameStyle = opts.small ? ' style="font-size:12px"' : '';
  const desc = (opts.desc !== false && p.desc)
    ? '<div class="oc-desc">'+p.desc+'</div>' : '';
  return '<div class="oc-card lv-'+lv+'"'+(opts.style ? ' style="'+opts.style+'"' : '')+' onclick="toggle(this)">'
    + '<div class="oc-top">'+avatar(p, lv, opts.small)
    +   '<div><div class="oc-name"'+nameStyle+'>'+p.name+'</div><div class="oc-role">'+role+'</div></div>'
    + '</div>'
    + desc + contacts(p)
    + '<div class="oc-hint">нажмите для контактов</div></div>';
}

function render(){
  let h = '';
  // Директор
  h += '<div style="padding:0 40px;margin-bottom:0">'+card(STRUCT.director,'director')+'</div>';
  h += '<div class="oc-connector"></div>';
  // Топ-менеджмент
  h += '<div class="oc-section-label">Топ-менеджмент</div>';
  h += '<div class="oc-grid-3" style="margin-bottom:8px">'
     + STRUCT.csuite.map(id => card(id,'csuite')).join('') + '</div>';
  // Главный бухгалтер под финдиректором
  h += '<div class="oc-sub-row" style="margin-left:calc(33% / 2 - 12px + 14px);max-width:calc(33% - 8px)">'
     + card(STRUCT.accountant,'admin',{small:true,desc:false,style:'flex:1'}) + '</div>';
  h += '<div style="height:20px"></div>';
  // Консультационный отдел
  h += '<div class="oc-section-label">Консультационный отдел</div>';
  h += '<div class="oc-grid-auto" style="margin-bottom:20px">'
     + STRUCT.consultants.map(id => card(id,'consult')).join('') + '</div>';
  // АХО
  h += '<div class="oc-section-label">Административно-хозяйственное управление</div>';
  h += '<div class="oc-grid-2" style="margin-bottom:20px">'
     + STRUCT.admin.map(id => card(id,'admin')).join('') + '</div>';
  // Руководители отделов
  h += '<div class="oc-section-label">Руководители отделов</div>';
  h += '<div class="oc-grid-auto">'
     + STRUCT.heads.map(id => card(id,'head')).join('') + '</div>';
  document.getElementById('oc-wrap').innerHTML = h;
}
render();

function toggle(card){
  const c=card.querySelector('.oc-contacts');
  const h=card.querySelector('.oc-hint');
  if(!c)return;
  const open=c.classList.toggle('open');
  if(h)h.textContent=open?'скрыть контакты':'нажмите для контактов';
}

/* Защита от «пустых квадратов»: активно грузим webfont Tabler, и только если
   он реально не загрузился — прячем глифы (текст контактов остаётся). */
(function(){
  var hide=function(){ document.documentElement.classList.add('no-ticons'); };
  if(!document.fonts||!document.fonts.load){ hide(); return; }
  var done=false, fail=setTimeout(function(){ if(!done){done=true;hide();} },4000);
  document.fonts.load('16px "tabler-icons"').then(function(faces){
    if(done) return; done=true; clearTimeout(fail);
    if(!faces||!faces.length) hide();
  }).catch(function(){ if(done) return; done=true; clearTimeout(fail); hide(); });
})();
</script>
</body>
</html>
